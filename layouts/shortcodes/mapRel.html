{{/*
  Usage: {{< gpx route="route.gpx" title="Mi recorrido" >}}
  Self-contained: loads Leaflet + GPXParser on its own, once per page,
  even if the shortcode is used several times.
*/}}
{{ $id := printf "gpx-map-%d" .Ordinal }}
{{ $route := print "/files" .Page.RelPermalink (.Get "route") }}

<link rel="stylesheet" href="/css/leaflet.css">
<style>
  /* Full content width, overriding browser/theme figure styles
     (default 40px side margins, inline-block/table/max-width from themes) */
  figure.gpx-figure {
    display: block;
    width: 100%;
    max-width: none;
    margin: 1em 0;
    padding: 0;
    text-align: center;
    background: transparent !important;
    border: 0;
    box-shadow: none;
  }
  .gpx-figure figcaption { background: transparent; }
  .gpx-figure .gpx-map { display: block; width: 100%; height: 400px; }
</style>

<figure class="gpx-figure">
  <div id="{{ $id }}" class="gpx-map"></div>
  <figcaption class="caption">
    {{ .Get "title" }} (<a href="{{ $route }}" download>Descargar GPX</a>)
  </figcaption>
</figure>

<script>
(function () {
  // Load dependencies once per page, shared by every map on it.
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error(`Failed to load ${src}`));
      document.head.append(s);
    });
  }
  window.gpxMapDeps = window.gpxMapDeps || Promise.all([
    loadScript('/js/leaflet.js'),
    loadScript('/js/GPXParser.min.js')
  ]);

  const el = document.getElementById({{ $id }});
  const route = {{ $route }};

  function waypointPopup(w) {
    const popup = document.createElement('div');
    if (w.name) {
      const b = document.createElement('strong');
      b.textContent = w.name;
      popup.append(b);
    }
    const desc = w.desc || w.cmt;
    if (desc) {
      const p = document.createElement('p');
      p.textContent = desc;
      popup.append(p);
    }
    if (w.ele != null) {
      const e = document.createElement('small');
      e.textContent = `${Math.round(w.ele)} m`;
      popup.append(e);
    }
    return popup.childNodes.length ? popup : null;
  }

  function showError(err, map) {
    console.error('gpx map:', err);
    if (map) map.remove();
    el.textContent = 'No se pudo cargar el recorrido.';
  }

  Promise.all([window.gpxMapDeps, fetch(route)])
    .then(([, r]) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.text();
    })
    .then(text => {
      const map = L.map(el, { scrollWheelZoom: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        // OSM requires a Referer; this overrides a page-wide "no-referrer"
        // policy (some themes set one) just for the tile requests.
        // Needs Leaflet 1.9+.
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      try {
        const gpx = new gpxParser();
        gpx.parse(text);

        const layers = L.featureGroup().addTo(map);

        // Tracks and routes
        const lines = [...gpx.tracks, ...gpx.routes]
          .map(t => t.points.map(p => [p.lat, p.lon]))
          .filter(l => l.length > 0);
        if (lines.length) L.polyline(lines, { color: 'red' }).addTo(layers);

        // Waypoints / points of interest
        for (const w of gpx.waypoints) {
          const marker = L.circleMarker([w.lat, w.lon], {
            radius: 7,
            color: '#fff',
            weight: 2,
            fillColor: '#1e66f5',
            fillOpacity: 1
          }).addTo(layers);
          const popup = waypointPopup(w);
          if (popup) marker.bindPopup(popup);
          if (w.name) marker.bindTooltip(w.name);
        }

        if (!layers.getLayers().length) throw new Error('GPX has no tracks or waypoints');
        map.fitBounds(layers.getBounds(), { padding: [20, 20], maxZoom: 16 });
      } catch (err) {
        showError(err, map);
      }
    })
    .catch(err => showError(err));
})();
</script>
