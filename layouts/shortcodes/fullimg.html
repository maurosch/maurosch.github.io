{{/*
  Full-bleed image: spans the whole window width, breaking out of the text column.
  Usage: {{< full-image src="/images/foo.jpg" title="Caption" alt="Optional alt" >}}
*/}}
{{ $alt := .Get "alt" | default (.Get "title") }}

<figure class="full-bleed">
  <img src="{{ .Get "src" }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  {{ with .Get "title" }}<figcaption class="caption">{{ . }}</figcaption>{{ end }}
</figure>

<style>
  figure.full-bleed {
    display: block;
    margin: 1em 0;
    padding: 5px 0;
    text-align: center;
    max-width: none;
    background: transparent !important;
  }
  figure.full-bleed img { display: block; width: 100%; height: auto; max-width: none; }
</style>
<script>
(function () {
  if (window.fullBleedInit) return;  // once per page, however many images
  window.fullBleedInit = true;

  // Stretch every .full-bleed figure from the window's left edge to its right
  // edge. clientWidth excludes the vertical scrollbar, unlike 100vw, so the
  // figure never sticks out and causes horizontal scrolling.
  function layout() {
    const width = document.documentElement.clientWidth;
    for (const fig of document.querySelectorAll('figure.full-bleed')) {
      fig.style.marginLeft = '0';
      fig.style.width = '';
      const left = fig.getBoundingClientRect().left + window.scrollX;
      fig.style.marginLeft = -left + 'px';
      fig.style.width = width + 'px';
    }
  }
  layout();
  document.addEventListener('DOMContentLoaded', layout);
  // Fires on window resize and when the scrollbar appears/disappears
  // (e.g. after images load and the page gets taller).
  new ResizeObserver(layout).observe(document.documentElement);
})();
</script>
